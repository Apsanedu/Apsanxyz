{{ if or .Next .Prev -}}
<div id="nextprev" style="display: flex; justify-content: space-between; margin: 2rem 0; padding: 1rem 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee;">
    {{- with .Prev }}
    <a href="{{ .RelPermalink}}" style="text-decoration: none; flex: 1;">
        <div id="prevart" style="padding: 1rem 1rem 1rem 4rem; color: #666; transition: all 0.3s ease; background: #f9f9f9; border-radius: 5px; margin-right: 1rem;">
            <span style="display: block; font-size: 0.9em; color: #999;">Previous:</span>
            <span style="color: #333; font-weight: 500;">{{.Title}}</span>
        </div>
    </a>
    {{ end -}}
    {{- with .Next -}}
    <a href="{{ .RelPermalink}}" style="text-decoration: none; flex: 1;">
        <div id="nextart" style="padding: 1rem 4rem 1rem 1rem; color: #666; transition: all 0.3s ease; background: #f9f9f9; border-radius: 5px; margin-left: 1rem; text-align: right;">
            <span style="display: block; font-size: 0.9em; color: #999;">Next:</span>
            <span style="color: #333; font-weight: 500;">{{.Title}}</span>
        </div>
    </a>
    {{ end -}}
</div>
{{ end -}}
